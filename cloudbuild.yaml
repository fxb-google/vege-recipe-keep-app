steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/vege-recipe-app:$SHORT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/vege-recipe-app:latest',
      '.'
    ]

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vege-recipe-app:latest']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'vege-recipe-app',
      '--image', 'gcr.io/$PROJECT_ID/vege-recipe-app:latest',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

images:
  - 'gcr.io/$PROJECT_ID/vege-recipe-app:latest'
